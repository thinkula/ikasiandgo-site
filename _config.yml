# GitHub Pages publishes everything in the repo root, which by default put the
# entire codebase on ikasiandgo.com: the app source, the Xcode project, the
# build output and the tooling. None of it held secrets, and the repo is public
# anyway, so nothing here is about hiding code. It is about what the domain
# should answer for.
#
# What stays published: the five pages, assets/ (css, font, screenshots), CNAME,
# and the root vocabulary.json, which the app fetches at launch to pick up word
# corrections without an App Store release. Do not exclude that file.
#
# Notes on specific entries:
#   www/     the Vite build output. Its index.html answered 200 at /www/ as a
#            blank second homepage, because its script tag points at
#            /assets/index-*.js while the bundle only lives under /www/assets/.
#   public/  the Vite build input. Its vocabulary.json is a mirror of the root
#            file and carried no freshness guarantee. Safe to exclude only
#            because the site font now lives in assets/fonts/ rather than here.
#   src/     the app source, 752KB of App.jsx. The app's own font reference is
#            relative, so excluding this does not affect the build.
exclude:
  - appshell/
  - ios/
  - public/
  - src/
  - tools/
  - www/
  - README.md
  - capacitor.config.json
  - package.json
  - package-lock.json
  - sync-vocab.js
  - vite.config.js
